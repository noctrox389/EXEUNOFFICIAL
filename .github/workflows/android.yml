name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK and NDK
        run: |
          sdkmanager "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;27.2.12479018"

      - name: Install Haxe dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install
          haxelib list

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/27.2.12479018"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

      - name: Build Android
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicEXE-Android-APK
          path: export/**/*.apk
          if-no-files-found: error

      - name: Upload game assets
        uses: actions/upload-artifact@v4
        with:
          name: SonicEXE-Mobile-Contents
          path: export/mobile-contents/
          if-no-files-found: error
